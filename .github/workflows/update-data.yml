name: Update Dashboard Data

on:
  schedule:
    # Run every 15 minutes during market hours across LSE, TSX, and NYSE (covers both EDT and EST):
    - cron: '*/15 13-21 * * 1-5'
    # Layer 2 Settled Statistical Engine snapshots (after official closes across all 3 exchanges):
    # 20:25 UTC: Settled snapshot during Daylight Saving Time (EDT: NYSE/TSX closed 20:00 UTC, MOC & Tape B final)
    - cron: '25 20 * * 1-5'
    # 21:25 UTC: Settled snapshot during Standard Time (EST: NYSE/TSX closed 21:00 UTC, MOC & Tape B final)
    - cron: '25 21 * * 1-5'
    # 22:00 UTC: Final EOD settlement & clearinghouse reconciliation
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # Allow manual triggers

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas numpy scipy

      - name: Run data pipeline
        run: |
          python scripts/data_pipeline.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Run trough-peak history builder
        run: |
          python scripts/trough_peak_data.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Copy data to docs folder
        run: |
          cp data/dashboard_data.json docs/data/ 2>/dev/null || true
          cp data/latest_signals.json docs/data/ 2>/dev/null || true
          cp data/validation_results.json docs/data/ 2>/dev/null || true
          cp data/split_warnings.json docs/data/ 2>/dev/null || true
          cp data/known_splits.json docs/data/ 2>/dev/null || true

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/ data/
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Update dashboard data $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Pull-rebase before push so concurrent runs don't cause rejection.
            git pull --rebase origin main
            git push
          fi
