name: Test Suites

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run Alert Engine tests
        run: node tools/test_alert_engine.mjs

      - name: Run CVOL tests
        run: node tools/test_cvol.js

      - name: Run Contract Ledger tests
        run: node tools/test_contract_ledger.mjs

      - name: Run Pair Stress & VDDS tests
        run: node tools/test_pair_stress_and_vdds.mjs
